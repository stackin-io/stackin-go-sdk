name: 🧾 Integration

on:
  workflow_call:
  workflow_dispatch:

jobs:
  integration:
    name: Issue a real document
    runs-on: ubuntu-latest
    environment: workflow

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.23"


      - name: 🧾 Issue an NFS-e through the published surface
        env:
          STACKIN_API_KEY: ${{ secrets.STACKIN_API_KEY }}
        run: |
          go run ./examples/nfse/basic > result.json
          echo "the API issued a document"

      - name: 📋 Summary
        if: always()
        run: |
          echo "### Integration ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "examples/nfse/basic against the live API" >> "$GITHUB_STEP_SUMMARY"
