name: 📦 Release MOD

# Go has no registry to push to: the module proxy resolves straight from the
# tag. So this does not publish — it makes the release reproducible. It
# writes LAST_VERSION from the tag, runs the same tests and lint the branch
# runs, and then asks the proxy for the version so the first `go get` after
# a release is not the one paying to warm the cache.
#
# It used to *verify* LAST_VERSION instead, which made every release a
# two-step ritual — bump, push, then tag — and three releases in a row
# failed because the tag came first. Deriving it from the tag is what the
# Python SDK does, and there is one source of truth either way.
#
# What this cannot fix, and nobody should expect it to: the commit lands
# after the tag, so the tag itself still carries the previous
# LAST_VERSION. For Go that is cosmetic — the proxy serves the tagged
# commit and nothing reads LAST_VERSION at build time — but it is why the
# file is a record of the last release, not of the tagged tree.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to verify, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-version:
    name: Write LAST_VERSION from the tag
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 🔍 Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The Go proxy needs a semver tag prefixed with v, got $TAG."
            exit 1
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag $TAG -> ${TAG#v}"

      - name: 📝 Write LAST_VERSION
        run: echo "${{ steps.version.outputs.version }}" > LAST_VERSION

      - name: 💾 Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add LAST_VERSION

          if git diff --staged --quiet; then
            echo "LAST_VERSION already says this version"
            exit 0
          fi

          git commit -m "📦 MOD: Update version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  test:
    name: Run Tests
    needs: [update-version]
    uses: ./.github/workflows/test.yml
    secrets: inherit

  code-quality:
    name: Code Quality Checks
    needs: [update-version]
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  integration:
    name: Issue a real document
    needs: [update-version, test, code-quality]
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  warm-proxy:
    name: Warm the module proxy
    needs: [update-version, test, code-quality, integration]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.23"

      - name: 🔥 Ask the proxy for this version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          MODULE="$(head -1 go.mod | cut -d' ' -f2)"
          echo "fetching $MODULE@$TAG"

          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org go list -m "$MODULE@$TAG"; then
              echo "proxy is serving $TAG"
              exit 0
            fi
            echo "not indexed yet, retrying in 30s (attempt $attempt/5)"
            sleep 30
          done

          echo "::warning::The proxy has not indexed $TAG yet."
          echo "::warning::It usually catches up on its own; go get will trigger it."

      - name: 📋 Summary
        if: always()
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "go get github.com/stackin-io/stackin-go-sdk@$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
