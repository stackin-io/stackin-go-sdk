name: 📦 Release MOD

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to publish, without the v prefix
        required: true
        type: string
      registry:
        description: go
        required: true
        type: choice
        options: [go]

permissions:
  contents: read

jobs:
  release-tag:
    name: Check the release tag
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Semver tag
        run: |
          if ! printf '%s' "v${{ inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Go needs a semver tag prefixed with v, got v${{ inputs.version }}."
            exit 1
          fi

      - name: 📥 Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}

  test:
    name: Run Tests
    needs: [release-tag]
    uses: ./.github/workflows/test.yml
    secrets: inherit

  code-quality:
    name: Code Quality Checks
    needs: [release-tag]
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  integration:
    name: Issue a real document
    needs: [test, code-quality]
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  warm-proxy:
    name: Warm the module proxy
    needs: [test, code-quality, integration]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: 📦 Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.23"

      - name: 🔥 Ask the proxy for this version
        run: |
          TAG="v${{ inputs.version }}"
          MODULE="$(head -1 go.mod | cut -d' ' -f2)"
          echo "fetching $MODULE@$TAG"

          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org go list -m "$MODULE@$TAG"; then
              echo "proxy is serving $TAG"
              exit 0
            fi
            echo "not indexed yet, retrying in 30s (attempt $attempt/5)"
            sleep 30
          done

          echo "::warning::The proxy has not indexed $TAG yet."
          echo "::warning::It usually catches up on its own; go get will trigger it."

      - name: 📋 Summary
        if: always()
        run: |
          TAG="v${{ inputs.version }}"
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "go get github.com/stackin-io/stackin-go-sdk@$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
